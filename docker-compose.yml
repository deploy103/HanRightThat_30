services:
  web:
    build: .
    ports:
      # 기본값(127.0.0.1)은 이 VM 안에서만 접근 가능하다.
      # 리버스 프록시가 다른 VM(같은 프라이빗 네트워크)에 있다면 .env 에서
      # BIND_ADDR 을 이 VM의 프라이빗 IP(또는 0.0.0.0)로 바꾸고, 반드시 방화벽/보안그룹으로
      # 리버스 프록시 서버의 IP 외에는 이 포트에 접근하지 못하도록 막아야 한다.
      - "${BIND_ADDR:-127.0.0.1}:8787:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      FESTIVAL_DB: /app/data/festival.json
      ADMIN_DB: /app/data/admin.json
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 환경변수를 설정해 주세요}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.hanwol.site}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.hanwol.site}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
